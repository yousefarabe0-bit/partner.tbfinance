name: Reclame Aqui – agente diário

# Entra na conta da TB Finance no Reclame Aqui, responde reclamações novas e mantém o perfil em dia.
# Configuração e primeiros passos: automation/reclameaqui/README.md
on:
  schedule:
    - cron: '23 12 * * *' # todo dia ~9h20 (Brasília)
  workflow_dispatch:
    inputs:
      modo:
        description: 'auto = publica | rascunho = só escreve | explorar = só tira capturas para calibrar'
        type: choice
        options: [auto, rascunho, explorar]
        default: rascunho

permissions:
  contents: write

concurrency:
  group: reclameaqui
  cancel-in-progress: false

jobs:
  agente:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar navegador e SDK
        run: |
          npm install --no-save playwright@1 @anthropic-ai/sdk
          npx playwright install --with-deps chromium

      - name: Rodar agente
        env:
          RA_EMAIL: ${{ secrets.RA_EMAIL }}
          RA_PASSWORD: ${{ secrets.RA_PASSWORD }}
          RA_STORAGE_STATE: ${{ secrets.RA_STORAGE_STATE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RA_MODE: ${{ inputs.modo || vars.RA_MODE || 'auto' }}
        run: node automation/reclameaqui/agent.mjs

      # O repositório é público: capturas e respostas só saem daqui criptografadas com a senha do Reclame Aqui.
      - name: Criptografar relatório e capturas
        if: always()
        env:
          RA_PASSWORD: ${{ secrets.RA_PASSWORD }}
        run: |
          [ -d automation/reclameaqui/saida ] || exit 0
          tar czf - -C automation/reclameaqui saida | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:RA_PASSWORD -out reclameaqui-relatorio.tar.gz.enc
          rm -rf automation/reclameaqui/saida

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reclameaqui-relatorio
          path: reclameaqui-relatorio.tar.gz.enc
          retention-days: 14
          if-no-files-found: ignore

      - name: Registrar respostas publicadas
        if: always()
        run: |
          F="automation/reclameaqui/respondidas.json automation/reclameaqui/imagens-enviadas.txt"
          if [ -n "$(git status --porcelain $F)" ]; then
            git config user.name "reclameaqui-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $F
            git commit -m "chore(reclameaqui): registra respostas [skip ci]"
            git pull --rebase
            git push
          fi
