name: Reclame Aqui – robô diário

# Entra na conta da TB Finance no Reclame Aqui, publica as respostas que o Claude escreveu (respostas.json),
# mantém o perfil em dia e coleta as reclamações novas (caixa/entrada.json) para o Claude responder. Não usa API paga.
# O Claude dispara este workflow pela tarefa agendada diária; o horário abaixo é só reserva.
# Detalhes: automation/reclameaqui/README.md
on:
  # Agendamento pausado: o Reclame Aqui bloqueia o GitHub com a verificação anti-robô da Cloudflare (23/11/2026).
  workflow_dispatch:
    inputs:
      modo:
        description: 'auto = publica, atualiza perfil e coleta | rascunho = só coleta | explorar = só capturas para calibrar'
        type: choice
        options: [auto, rascunho, explorar]
        default: auto

permissions:
  contents: write

concurrency:
  group: reclameaqui
  cancel-in-progress: false

jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar navegador
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Rodar robô
        env:
          RA_EMAIL: ${{ secrets.RA_EMAIL }}
          RA_PASSWORD: ${{ secrets.RA_PASSWORD }}
          RA_STORAGE_STATE: ${{ secrets.RA_STORAGE_STATE }}
          RA_MODE: ${{ inputs.modo || vars.RA_MODE || 'auto' }}
        run: node automation/reclameaqui/agent.mjs

      # Reclamações coletadas (já sem CPF, telefone e e-mail) e capturas de calibração/erro vão para caixa/
      - name: Guardar coleta
        if: always()
        run: |
          cd automation/reclameaqui
          [ -d saida ] || exit 0
          rm -rf caixa && mkdir -p caixa/capturas
          mv saida/entrada.json caixa/entrada.json
          mv saida/* caixa/capturas/ 2>/dev/null || true
          rm -rf saida

      - name: Salvar no repositório
        if: always()
        run: |
          F="automation/reclameaqui/caixa automation/reclameaqui/respondidas.json automation/reclameaqui/imagens-enviadas.txt"
          if [ -n "$(git status --porcelain $F)" ]; then
            git config user.name "reclameaqui-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $F
            git commit -m "chore(reclameaqui): coleta do dia [skip ci]"
            git pull --rebase
            git push
          fi
