name: Instagram – publicação agendada

on:
  schedule:
    - cron: '*/15 * * * *' # a cada 15 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Só simular (não publica nada)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'automation/instagram/posts.json'
      - 'automation/linkedin/posts.json'
      - 'automation/x/posts.json'
      - 'automation/threads/posts.json'

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar ffmpeg (vídeos do Drive)
        id: ffmpeg
        continue-on-error: true
        timeout-minutes: 4
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Instalar ffmpeg pelo apt (plano B)
        if: steps.ffmpeg.outcome != 'success'
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq || true
          sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends ffmpeg

      - name: Validar fila
        env:
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || 'https://raw.githubusercontent.com/yousefarabe0-bit/partner.tbfinance/main/' }}
        run: node automation/instagram/publish.mjs --validate

      - name: Publicar posts vencidos
        env:
          IG_PESSOAL_TOKEN: ${{ secrets.IG_PESSOAL_TOKEN }}
          IG_PESSOAL_USER_ID: ${{ secrets.IG_PESSOAL_USER_ID }}
          IG_EMPRESA_TOKEN: ${{ secrets.IG_EMPRESA_TOKEN }}
          IG_EMPRESA_USER_ID: ${{ secrets.IG_EMPRESA_USER_ID }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || 'https://raw.githubusercontent.com/yousefarabe0-bit/partner.tbfinance/main/' }}
          IG_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node automation/instagram/publish.mjs

      - name: Publicar no LinkedIn (perfil do Yousef)
        if: always()
        continue-on-error: true
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LI_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node automation/linkedin/publish.mjs

      - name: Publicar no X (perfil do Yousef)
        if: always()
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node automation/x/publish.mjs

      - name: Publicar no Threads (perfil do Yousef)
        if: always()
        continue-on-error: true
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node automation/threads/publish.mjs

      - name: Salvar histórico de publicações
        if: always()
        run: |
          if [ -n "$(git status --porcelain automation/instagram/published.json automation/linkedin/published.json automation/x/published.json automation/threads/published.json)" ]; then
            git config user.name "instagram-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add automation/instagram/published.json automation/linkedin/published.json automation/x/published.json automation/threads/published.json
            git commit -m "chore(instagram): registra publicações [skip ci]"
            git pull --rebase
            git push
          fi
