name: Instagram – métricas

# Lê alcance, views, curtidas, salvamentos e tempo assistido dos posts recentes (API oficial).
on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Data inicial (AAAA-MM-DD)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ler métricas
        env:
          IG_PESSOAL_TOKEN: ${{ secrets.IG_PESSOAL_TOKEN }}
          IG_PESSOAL_USER_ID: ${{ secrets.IG_PESSOAL_USER_ID }}
          IG_EMPRESA_TOKEN: ${{ secrets.IG_EMPRESA_TOKEN }}
          IG_EMPRESA_USER_ID: ${{ secrets.IG_EMPRESA_USER_ID }}
          METRICS_SINCE: ${{ inputs.since }}
        run: node automation/instagram/metrics.mjs
      - name: Métricas das 4 redes
        env:
          IG_PESSOAL_TOKEN: ${{ secrets.IG_PESSOAL_TOKEN }}
          IG_EMPRESA_TOKEN: ${{ secrets.IG_EMPRESA_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          METRICS_SINCE: ${{ inputs.since }}
        run: node automation/metrics/redes.mjs
